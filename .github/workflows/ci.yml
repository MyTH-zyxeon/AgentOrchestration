name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4
      - name: Runner provenance preflight
        env:
          AO_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: python -m src.ci.runner_provenance
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        run: uv sync
      - name: Run tests
        run: uv run pytest --cov=src tests/
      - name: Lint
        run: uv run flake8 src/ tests/

  release-runner-provenance:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Strict runner provenance preflight
        env:
          AO_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          AO_RUNNER_PROVENANCE_REQUIRED: "true"
        run: python -m src.ci.runner_provenance --strict
